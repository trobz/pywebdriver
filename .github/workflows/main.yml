name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    tags: ["v*.*.*"]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install virtualenv wheel
          virtualenv venv
          ./venv/Scripts/activate
          python -m pip install -r windows/requirements.txt
          python -m pip install pyinstaller
          python -m pip install .
      - name: Build
        run: |
          ./venv/Scripts/activate
          pyinstaller.exe windows/pywebdriver.spec
      - name: Test build
        shell: bash
        run: |
          timeout 3s ./dist/pywebdriver/pywebdriver.exe debug || test "$?" = 124
      - name: prepare release
        run: |
          iscc.exe windows/setup.iss
          move windows/Output/pywebdriver_win64_installer.exe .
          7z a pywebdriver_win64.zip dist/pywebdriver
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            pywebdriver_win64.zip
            pywebdriver_win64_installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-bionic:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ubuntu 18.04 package
        run: |
          docker run --rm -i \
            --user root \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -euxo pipefail -s <<'DOCKER_SCRIPT'

              echo "========================================="
              echo "Ubuntu version"
              echo "========================================="

              cat /etc/os-release

              echo "========================================="
              echo "Configure Bionic repositories"
              echo "========================================="

              cat > /etc/apt/sources.list <<'SOURCES_EOF'
          deb http://archive.ubuntu.com/ubuntu bionic main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu bionic-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu bionic-security main restricted universe multiverse
          SOURCES_EOF

              echo "========================================="
              echo "APT update"
              echo "========================================="

              apt-get update

              echo "========================================="
              echo "Install dependencies"
              echo "========================================="

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                ca-certificates \
                libnss3-tools \
                libcups2-dev \
                cups \
                devscripts \
                debhelper \
                dh-python \
                dh-virtualenv \
                python3-wheel \
                python3-setuptools \
                python3-venv \
                libmtp-dev \
                libffi-dev \
                fakeroot \
                python3-distutils \
                python3-pip \
                python3-simplejson \
                python3-flask-babel \
                python3-usb \
                python3-serial \
                python3-netifaces \
                python3-cups \
                python3-pillow \
                dh-systemd \
                perl

              echo "========================================="
              echo "Python"
              echo "========================================="

              python3 -m pip install \
                --no-cache-dir \
                "setuptools>45,<82"

              python3 -m pip install flask-cors

              python3 -m pip install "python-barcode==0.14.0"

              echo "========================================="
              echo "Build flags"
              echo "========================================="

              export DEB_CFLAGS_SET="-march=x86-64 -mtune=generic"
              export DEB_CXXFLAGS_SET="-march=x86-64 -mtune=generic"
              export CFLAGS="-march=x86-64 -mtune=generic"
              export CXXFLAGS="-march=x86-64 -mtune=generic"

              echo "DEB_CFLAGS_SET=$DEB_CFLAGS_SET"
              echo "DEB_CXXFLAGS_SET=$DEB_CXXFLAGS_SET"
              echo "CFLAGS=$CFLAGS"
              echo "CXXFLAGS=$CXXFLAGS"

              # 18.04 build uses Python 3.6, whose default text encoding in this environment is ASCII.
              # In postelium package, there are some unicode characters in the description.
              # Set LANG and LC_ALL to C.UTF-8 to avoid "UnicodeEncodeError: 'ascii' codec can't encode characters in position ... errors
              export LANG=C.UTF-8
              export LC_ALL=C.UTF-8

              echo "========================================="
              echo "Build package"
              echo "========================================="

              mkdir -p build

              VERSION=$(date +%Y%m%d)
              DEBIAN_FRONTEND=noninteractive apt-get install -y devscripts
              /usr/bin/dch \
                --package pywebdriver \
                --newversion "$VERSION" \
                --create \
                -m "Created by CI"

              debuild

              echo "========================================="
              echo "Build result"
              echo "========================================="

              ls -lah ../*.deb

              # debuild/dpkg-buildpackage always drops the .deb one level
              # above the source dir (i.e. outside /workspace, which is the
              # only path bind-mounted back to the host). Copy it into the
              # bind-mounted build/ dir so it survives past --rm.
              cp ../*.deb build/
              # build/ was created (mkdir -p above) and the .deb copied as
              # root inside the container; open up permissions so the
              # unprivileged host runner user can mv/read it afterward.
              chmod -R a+rwX build
          DOCKER_SCRIPT

      - name: Rename package
        run: |
          mv build/pywebdriver_$(date +%Y%m%d)_amd64.deb \
            ../pywebdriver_bionic.deb

          ls -lah ../pywebdriver_bionic.deb

      - name: Verify package
        run: |
          dpkg-deb --info ../pywebdriver_bionic.deb

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ../pywebdriver_bionic.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-jammy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - name: Install dependencies
        run: |
          sudo apt --yes update
          sudo apt --yes install libnss3-tools libcups2-dev cups devscripts debhelper dh-python dh-virtualenv python3-wheel python3-setuptools python3-venv libmtp-dev libffi-dev fakeroot python3-distutils python3-pip python3-simplejson python3-flask-babel python3-usb python3-serial python3-netifaces python3-cups python3-pillow python3-flask-cors
          sudo python3 -m pip install "setuptools>45,<82"
      - name: Build
        env:
          # For weak/old CPUs which don't support AVX (e.g. Celeron J4125)
          DEB_CFLAGS_SET: "-march=x86-64 -mtune=generic"
          DEB_CXXFLAGS_SET: "-march=x86-64 -mtune=generic"
          CFLAGS: "-march=x86-64 -mtune=generic"
          CXXFLAGS: "-march=x86-64 -mtune=generic"
        run: |
          mkdir -p build
          dch --package pywebdriver --newversion $(date +%Y%m%d) --create -m "Created by CI"
          debuild
      - name: Test build
        run: |
          mv ../pywebdriver_$(date +%Y%m%d)_amd64.deb ../pywebdriver_jammy.deb
          sudo dpkg -i ../pywebdriver_jammy.deb
          sh debian/replace_snakeoil_mkcert.sh
          sudo journalctl -u pywebdriver
          sudo service pywebdriver status
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ../pywebdriver_jammy.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-noble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - name: Install dependencies
        run: |
          sudo apt --yes update
          sudo apt --yes install build-essential libnss3-tools libcups2-dev cups devscripts debhelper dh-python dh-virtualenv python3-wheel python3-setuptools python3-venv libmtp-dev libffi-dev fakeroot python3-pip python3-simplejson python3-flask-babel python3-usb python3-serial python3-netifaces python3-cups python3-pillow python3-flask-cors
          sudo python3 -m pip install --break-system-packages "setuptools>45,<82"
      - name: Build
        env:
          # For weak/old CPUs which don't support AVX (e.g. Celeron J4125)
          DEB_CFLAGS_SET: "-march=x86-64 -mtune=generic"
          DEB_CXXFLAGS_SET: "-march=x86-64 -mtune=generic"
          CFLAGS: "-march=x86-64 -mtune=generic"
          CXXFLAGS: "-march=x86-64 -mtune=generic"
        run: |
          mkdir -p build
          dch --package pywebdriver --newversion $(date +%Y%m%d) --create -m "Created by CI"
          debuild
      - name: Test build
        run: |
          mv ../pywebdriver_$(date +%Y%m%d)_amd64.deb ../pywebdriver_noble.deb
          sudo dpkg -i ../pywebdriver_noble.deb
          sh debian/replace_snakeoil_mkcert.sh
          sudo journalctl -u pywebdriver
          sudo service pywebdriver status
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ../pywebdriver_noble.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-resolute:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - name: Install dependencies
        run: |
          sudo apt --yes update
          sudo apt --yes install build-essential libnss3-tools libcups2-dev cups devscripts debhelper dh-python dh-virtualenv python3-wheel python3-setuptools python3-venv libmtp-dev libffi-dev fakeroot python3-pip python3-simplejson python3-flask-babel python3-usb python3-serial python3-netifaces python3-cups python3-pillow python3-flask-cors
          sudo python3 -m pip install --break-system-packages "setuptools>45,<82"
      - name: Build
        env:
          # For weak/old CPUs which don't support AVX (e.g. Celeron J4125)
          DEB_CFLAGS_SET: "-march=x86-64 -mtune=generic"
          DEB_CXXFLAGS_SET: "-march=x86-64 -mtune=generic"
          CFLAGS: "-march=x86-64 -mtune=generic"
          CXXFLAGS: "-march=x86-64 -mtune=generic"
        run: |
          mkdir -p build
          rm -f debian/changelog
          dch --package pywebdriver --newversion $(date +%Y%m%d) --create -M "Created by CI"
          debuild
      - name: Test build
        run: |
          mv ../pywebdriver_$(date +%Y%m%d)_amd64.deb ../pywebdriver_resolute.deb
          sudo dpkg -i ../pywebdriver_resolute.deb
          sh debian/replace_snakeoil_mkcert.sh
          sudo journalctl -u pywebdriver
          sudo service pywebdriver status
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ../pywebdriver_resolute.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
